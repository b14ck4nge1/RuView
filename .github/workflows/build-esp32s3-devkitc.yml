name: Build ESP32-S3 DevKitC Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/esp32-csi-node/**"
      - ".github/workflows/build-esp32s3-devkitc.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build display-less ESP32-S3 firmware with ESP-IDF 5.4
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/firmware/esp32-csi-node:/project" \
            -w /project \
            espressif/idf:v5.4 \
            bash -lc "rm -rf build sdkconfig && idf.py -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.defaults.devkitc' set-target esp32s3 && idf.py -DSDKCONFIG_DEFAULTS='sdkconfig.defaults;sdkconfig.defaults.devkitc' build"

      - name: Collect flash binaries
        run: |
          mkdir -p artifact
          cp firmware/esp32-csi-node/build/bootloader/bootloader.bin artifact/bootloader.bin
          cp firmware/esp32-csi-node/build/partition_table/partition-table.bin artifact/partition-table.bin
          cp firmware/esp32-csi-node/build/ota_data_initial.bin artifact/ota_data_initial.bin
          cp firmware/esp32-csi-node/build/esp32-csi-node.bin artifact/esp32-csi-node.bin
          cp firmware/esp32-csi-node/build/flash_args artifact/flash_args.txt || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-devkitc-firmware
          path: artifact/
          if-no-files-found: error
          retention-days: 30
